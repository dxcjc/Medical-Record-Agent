<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>医疗文档识别系统</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ============================
   Design System: Clinical AI
   Apple-inspired minimalism
   ============================ */

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  /* Colors — muted, professional */
  --blue: #0071E3;
  --blue-hover: #0077ED;
  --blue-light: #F0F5FF;
  --green: #30D158;
  --green-bg: #F0FFF4;
  --orange: #FF9F0A;
  --orange-bg: #FFF8F0;
  --red: #FF453A;
  --red-bg: #FFF0F0;
  --gray-50: #FBFBFD;
  --gray-100: #F5F5F7;
  --gray-200: #E8E8ED;
  --gray-300: #D2D2D7;
  --gray-400: #86868B;
  --gray-500: #6E6E73;
  --gray-600: #424245;
  --gray-700: #2D2D2F;
  --gray-800: #1D1D1F;
  --white: #FFFFFF;
  --sidebar-bg: #FBFBFD;
  --sidebar-active: rgba(0, 113, 227, 0.08);

  /* Typography */
  --font: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --text-xs: 11px;
  --text-sm: 13px;
  --text-base: 15px;
  --text-lg: 17px;
  --text-xl: 20px;
  --text-2xl: 24px;
  --text-3xl: 28px;
  --text-4xl: 34px;
  --weight-normal: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;
  --leading-tight: 1.2;
  --leading-normal: 1.5;
  --leading-relaxed: 1.7;
  --tracking-tight: -0.022em;
  --tracking-normal: -0.01em;

  /* Spacing — 4px grid */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px;
  --s5: 20px; --s6: 24px; --s8: 32px; --s10: 40px;
  --s12: 48px; --s16: 64px; --s20: 80px;

  /* Radii */
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --r-xl: 20px;
  --r-full: 9999px;

  /* Shadows — Apple-style layered */
  --shadow-xs: 0 0 0 1px rgba(0,0,0,0.04);
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04), 0 0 0 1px rgba(0,0,0,0.03);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.06), 0 0 0 1px rgba(0,0,0,0.03);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.08), 0 0 0 1px rgba(0,0,0,0.03);
  --shadow-xl: 0 20px 60px rgba(0,0,0,0.1), 0 0 0 1px rgba(0,0,0,0.03);

  /* Layout */
  --sidebar-w: 260px;
  --header-h: 52px;
  --content-max: 1200px;
}

html { font-size: 15px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body { font-family: var(--font); color: var(--gray-800); background: var(--gray-100); line-height: var(--leading-normal); letter-spacing: var(--tracking-normal); }

a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }

::selection { background: rgba(0,113,227,0.15); }

/* ============================
   Login
   ============================ */
.login-page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--gray-100);
  padding: var(--s8);
}
.login-card {
  width: 100%;
  max-width: 400px;
  background: var(--white);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-xl);
  padding: var(--s12) var(--s10);
  text-align: center;
}
.login-logo {
  width: 56px; height: 56px;
  background: var(--blue);
  border-radius: var(--r-lg);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto var(--s6);
  font-size: 24px; color: white;
}
.login-card h1 {
  font-size: var(--text-xl);
  font-weight: var(--weight-semibold);
  color: var(--gray-800);
  margin-bottom: var(--s1);
  letter-spacing: var(--tracking-tight);
}
.login-card .subtitle {
  font-size: var(--text-sm);
  color: var(--gray-400);
  margin-bottom: var(--s8);
}
.login-field {
  text-align: left;
  margin-bottom: var(--s5);
}
.login-field label {
  display: block;
  font-size: var(--text-sm);
  font-weight: var(--weight-medium);
  color: var(--gray-600);
  margin-bottom: var(--s2);
}
.login-field input {
  width: 100%;
  padding: 10px 14px;
  font-size: var(--text-base);
  font-family: var(--font);
  border: 1px solid var(--gray-200);
  border-radius: var(--r-md);
  background: var(--gray-50);
  color: var(--gray-800);
  outline: none;
  transition: all 0.2s;
}
.login-field input:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(0,113,227,0.12);
  background: var(--white);
}
.login-btn {
  width: 100%;
  padding: 11px;
  font-size: var(--text-base);
  font-weight: var(--weight-medium);
  font-family: var(--font);
  background: var(--blue);
  color: white;
  border: none;
  border-radius: var(--r-md);
  cursor: pointer;
  transition: all 0.15s;
  margin-top: var(--s6);
}
.login-btn:hover { background: var(--blue-hover); }
.login-btn:active { transform: scale(0.98); }
.login-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ============================
   App Shell
   ============================ */
.app { display: flex; min-height: 100vh; }

/* Sidebar */
.sidebar {
  width: var(--sidebar-w);
  background: var(--sidebar-bg);
  border-right: 1px solid var(--gray-200);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; bottom: 0; left: 0;
  z-index: 10;
  overflow-y: auto;
  overflow-x: hidden;
}
.sidebar-brand {
  padding: var(--s6) var(--s6) var(--s5);
  display: flex;
  align-items: center;
  gap: var(--s3);
  border-bottom: 1px solid var(--gray-200);
}
.sidebar-brand .logo {
  width: 36px; height: 36px;
  background: var(--blue);
  border-radius: var(--r-md);
  display: flex; align-items: center; justify-content: center;
  color: white; font-size: 16px;
  flex-shrink: 0;
}
.sidebar-brand .brand-text h2 {
  font-size: var(--text-sm);
  font-weight: var(--weight-semibold);
  color: var(--gray-800);
  line-height: var(--leading-tight);
}
.sidebar-brand .brand-text span {
  font-size: var(--text-xs);
  color: var(--gray-400);
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.sidebar-nav { padding: var(--s4) var(--s3); flex: 1; }
.nav-section-label {
  font-size: var(--text-xs);
  font-weight: var(--weight-semibold);
  color: var(--gray-400);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  padding: var(--s4) var(--s3) var(--s2);
}
.nav-item {
  display: flex;
  align-items: center;
  gap: var(--s3);
  padding: 8px 12px;
  border-radius: var(--r-sm);
  font-size: var(--text-sm);
  font-weight: var(--weight-medium);
  color: var(--gray-500);
  cursor: pointer;
  transition: all 0.15s;
  margin-bottom: 1px;
  text-decoration: none;
  user-select: none;
}
.nav-item:hover {
  background: var(--gray-100);
  color: var(--gray-700);
  text-decoration: none;
}
.nav-item.active {
  background: var(--sidebar-active);
  color: var(--blue);
}
.nav-item .nav-icon {
  width: 20px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  opacity: 0.6;
}
.nav-item.active .nav-icon { opacity: 1; }

.sidebar-user {
  padding: var(--s4) var(--s6);
  border-top: 1px solid var(--gray-200);
  display: flex;
  align-items: center;
  gap: var(--s3);
}
.sidebar-user .avatar {
  width: 32px; height: 32px;
  border-radius: var(--r-full);
  background: var(--blue-light);
  color: var(--blue);
  display: flex; align-items: center; justify-content: center;
  font-size: var(--text-sm);
  font-weight: var(--weight-semibold);
  flex-shrink: 0;
}
.sidebar-user .user-info {
  flex: 1;
  min-width: 0;
}
.sidebar-user .user-name {
  font-size: var(--text-sm);
  font-weight: var(--weight-medium);
  color: var(--gray-700);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sidebar-user .user-email {
  font-size: var(--text-xs);
  color: var(--gray-400);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sidebar-user .logout-btn {
  background: none;
  border: none;
  color: var(--gray-400);
  cursor: pointer;
  padding: var(--s2);
  border-radius: var(--r-sm);
  font-size: var(--text-sm);
  transition: all 0.15s;
}
.sidebar-user .logout-btn:hover {
  color: var(--red);
  background: var(--red-bg);
}

/* Main content */
.main {
  margin-left: var(--sidebar-w);
  flex: 1;
  min-width: 0;
}
.main-header {
  height: var(--header-h);
  background: var(--white);
  border-bottom: 1px solid var(--gray-200);
  display: flex;
  align-items: center;
  padding: 0 var(--s8);
  position: sticky;
  top: 0;
  z-index: 5;
}
.breadcrumb {
  display: flex;
  align-items: center;
  gap: var(--s2);
  font-size: var(--text-sm);
  color: var(--gray-400);
}
.breadcrumb span { color: var(--gray-800); font-weight: var(--weight-medium); }

.content {
  padding: var(--s8);
  max-width: var(--content-max);
}

/* Page title area */
.page-top {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: var(--s8);
}
.page-top h1 {
  font-size: var(--text-2xl);
  font-weight: var(--weight-bold);
  color: var(--gray-800);
  letter-spacing: var(--tracking-tight);
  line-height: var(--leading-tight);
}
.page-top .page-desc {
  font-size: var(--text-sm);
  color: var(--gray-400);
  margin-top: var(--s1);
}

/* ============================
   KPI Cards
   ============================ */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--s4);
  margin-bottom: var(--s8);
}
.kpi {
  background: var(--white);
  border-radius: var(--r-lg);
  padding: var(--s6);
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.2s, transform 0.2s;
}
.kpi:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-1px);
}
.kpi-label {
  font-size: var(--text-sm);
  color: var(--gray-400);
  font-weight: var(--weight-medium);
  margin-bottom: var(--s2);
  display: flex;
  align-items: center;
  gap: var(--s2);
}
.kpi-label .dot {
  width: 6px; height: 6px;
  border-radius: var(--r-full);
  flex-shrink: 0;
}
.kpi-value {
  font-size: var(--text-4xl);
  font-weight: var(--weight-bold);
  color: var(--gray-800);
  letter-spacing: var(--tracking-tight);
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.kpi-sub {
  font-size: var(--text-xs);
  color: var(--gray-400);
  margin-top: var(--s2);
}

/* ============================
   Cards
   ============================ */
.card {
  background: var(--white);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.card-head {
  padding: var(--s5) var(--s6);
  border-bottom: 1px solid var(--gray-100);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.card-head h3 {
  font-size: var(--text-base);
  font-weight: var(--weight-semibold);
  color: var(--gray-800);
}

/* ============================
   Table
   ============================ */
.table-wrap { overflow-x: auto; }
table {
  width: 100%;
  border-collapse: collapse;
}
thead th {
  padding: var(--s3) var(--s6);
  font-size: var(--text-xs);
  font-weight: var(--weight-semibold);
  color: var(--gray-400);
  text-align: left;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  border-bottom: 1px solid var(--gray-100);
  white-space: nowrap;
  background: var(--gray-50);
}
tbody td {
  padding: var(--s3) var(--s6);
  font-size: var(--text-sm);
  color: var(--gray-600);
  border-bottom: 1px solid var(--gray-100);
  white-space: nowrap;
}
tbody tr {
  transition: background 0.1s;
  cursor: pointer;
}
tbody tr:hover { background: var(--gray-50); }
tbody tr:last-child td { border-bottom: none; }

.mono {
  font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
  font-size: var(--text-xs);
  color: var(--gray-500);
}

/* ============================
   Tags
   ============================ */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 10px;
  border-radius: var(--r-full);
  font-size: var(--text-xs);
  font-weight: var(--weight-semibold);
  line-height: 1.6;
}
.tag-green { background: var(--green-bg); color: #1B7A37; }
.tag-orange { background: var(--orange-bg); color: #995C00; }
.tag-red { background: var(--red-bg); color: #CC2B2B; }
.tag-blue { background: var(--blue-light); color: var(--blue); }
.tag-gray { background: var(--gray-100); color: var(--gray-500); }

.tag .tag-dot {
  width: 5px; height: 5px;
  border-radius: var(--r-full);
  background: currentColor;
}

/* ============================
   Buttons
   ============================ */
.btn {
  display: inline-flex;
  align-items: center;
  gap: var(--s2);
  padding: 7px 16px;
  border-radius: var(--r-sm);
  font-size: var(--text-sm);
  font-weight: var(--weight-medium);
  font-family: var(--font);
  cursor: pointer;
  border: none;
  transition: all 0.15s;
  white-space: nowrap;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--blue); color: white; }
.btn-primary:hover { background: var(--blue-hover); }
.btn-ghost {
  background: transparent;
  color: var(--blue);
  padding: 7px 10px;
}
.btn-ghost:hover { background: var(--blue-light); }
.btn-secondary {
  background: var(--white);
  color: var(--gray-600);
  border: 1px solid var(--gray-200);
}
.btn-secondary:hover { background: var(--gray-50); border-color: var(--gray-300); }

/* ============================
   Empty State
   ============================ */
.empty {
  text-align: center;
  padding: var(--s16) var(--s8);
}
.empty-icon {
  font-size: 40px;
  margin-bottom: var(--s4);
  opacity: 0.15;
}
.empty h3 {
  font-size: var(--text-lg);
  font-weight: var(--weight-semibold);
  color: var(--gray-600);
  margin-bottom: var(--s2);
}
.empty p {
  font-size: var(--text-sm);
  color: var(--gray-400);
  margin-bottom: var(--s6);
  max-width: 320px;
  margin-left: auto;
  margin-right: auto;
}

/* ============================
   Two-column Layout
   ============================ */
.two-col {
  display: grid;
  grid-template-columns: 300px 1fr;
  gap: var(--s6);
}
.list-card {
  background: var(--white);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.list-item {
  padding: var(--s4) var(--s5);
  cursor: pointer;
  transition: background 0.1s;
  border-bottom: 1px solid var(--gray-100);
}
.list-item:last-child { border-bottom: none; }
.list-item:hover { background: var(--gray-50); }
.list-item.active { background: var(--blue-light); }
.list-item .item-title {
  font-size: var(--text-sm);
  font-weight: var(--weight-medium);
  color: var(--gray-700);
}
.list-item .item-sub {
  font-size: var(--text-xs);
  color: var(--gray-400);
  margin-top: 2px;
}

/* ============================
   Detail Page
   ============================ */
.detail-header {
  display: flex;
  align-items: center;
  gap: var(--s4);
  margin-bottom: var(--s8);
}
.detail-header .back-btn {
  width: 36px; height: 36px;
  border-radius: var(--r-md);
  border: 1px solid var(--gray-200);
  background: var(--white);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: all 0.15s;
  flex-shrink: 0;
  font-size: 16px;
}
.detail-header .back-btn:hover { background: var(--gray-50); }
.detail-header .detail-title {
  flex: 1;
}
.detail-header .detail-title h1 {
  font-size: var(--text-xl);
  font-weight: var(--weight-semibold);
}

/* Steps */
.steps {
  display: flex;
  flex-direction: column;
  gap: 0;
}
.step {
  display: flex;
  gap: var(--s4);
  padding: var(--s3) 0;
}
.step-dot-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 20px;
  flex-shrink: 0;
}
.step-dot {
  width: 8px; height: 8px;
  border-radius: var(--r-full);
  background: var(--gray-300);
  flex-shrink: 0;
}
.step-dot.done { background: var(--green); }
.step-dot.active { background: var(--blue); box-shadow: 0 0 0 3px rgba(0,113,227,0.2); }
.step-dot.error { background: var(--red); }
.step-line {
  width: 1px;
  flex: 1;
  background: var(--gray-200);
  margin: 3px 0;
}
.step-content .step-name {
  font-size: var(--text-sm);
  font-weight: var(--weight-medium);
  color: var(--gray-700);
}
.step-content .step-msg {
  font-size: var(--text-xs);
  color: var(--gray-400);
  margin-top: 1px;
}

/* Field list */
.field-row {
  display: flex;
  align-items: flex-start;
  padding: var(--s4) 0;
  border-bottom: 1px solid var(--gray-100);
  gap: var(--s4);
}
.field-row:last-child { border-bottom: none; }
.field-key {
  font-size: var(--text-sm);
  font-weight: var(--weight-medium);
  color: var(--gray-500);
  min-width: 160px;
  flex-shrink: 0;
  padding-top: 2px;
}
.field-value {
  font-size: var(--text-sm);
  color: var(--gray-800);
  flex: 1;
}
.field-confidence {
  font-size: var(--text-xs);
  padding: 1px 8px;
  border-radius: var(--r-full);
  font-weight: var(--weight-semibold);
  flex-shrink: 0;
}
.conf-high { background: var(--green-bg); color: #1B7A37; }
.conf-mid { background: var(--orange-bg); color: #995C00; }
.conf-low { background: var(--red-bg); color: #CC2B2B; }

/* Provider grid */
.provider-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: var(--s4);
}
.provider-card {
  background: var(--white);
  border-radius: var(--r-lg);
  padding: var(--s6);
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.2s;
}
.provider-card:hover { box-shadow: var(--shadow-md); }
.provider-card .provider-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--s4);
}
.provider-card .provider-name {
  font-size: var(--text-base);
  font-weight: var(--weight-semibold);
  color: var(--gray-800);
}
.provider-card .provider-key {
  font-size: var(--text-xs);
  color: var(--gray-400);
  font-family: 'SF Mono', monospace;
  margin-top: 2px;
}
.provider-card .provider-actions {
  display: flex;
  gap: var(--s2);
  margin-top: var(--s4);
}

/* Audit table */
.audit-action {
  display: flex;
  align-items: center;
  gap: var(--s2);
}
.audit-action .action-icon {
  width: 24px; height: 24px;
  border-radius: var(--r-sm);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px;
  flex-shrink: 0;
}

/* Toast */
.toast {
  position: fixed;
  top: var(--s6);
  right: var(--s6);
  background: var(--gray-800);
  color: white;
  padding: var(--s3) var(--s5);
  border-radius: var(--r-md);
  font-size: var(--text-sm);
  box-shadow: var(--shadow-lg);
  z-index: 1000;
  opacity: 0;
  transform: translateY(-10px);
  transition: all 0.3s;
  pointer-events: none;
}
.toast.show {
  opacity: 1;
  transform: translateY(0);
}

/* Loading spinner */
.spinner {
  width: 20px; height: 20px;
  border: 2px solid var(--gray-200);
  border-top-color: var(--blue);
  border-radius: var(--r-full);
  animation: spin 0.6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.page-loading {
  display: flex;

  justify-content: center;

}

/* Tabs */

  border-bottom: 1px solid var(--gray-200);

}
.tab {
  padding: var(--s3) var(--s5);
  font-size: var(--text-sm);

}
.tab:hover { color: var(--gray-600); }
.tab.active { color: var(--blue); border-bottom-color: var(--blue); }

/* Upload zone */
.upload-zone {
  border: 2px dashed var(--gray-200);
  border-radius: var(--r-lg);

  transition: all 0.2s;
}
.upload-zone:hover {
  border-color: var(--blue);
  background: var(--blue-light);
}
.upload-zone .upload-icon {
  font-size: 32px;
  margin-bottom: var(--s3);
  opacity: 0.3;
}
.upload-zone h3 {
  font-size: var(--text-base);
  font-weight: var(--weight-medium);
  color: var(--gray-600);
  margin-bottom: var(--s1);
}
.upload-zone p {
  font-size: var(--text-sm);
  color: var(--gray-400);
}
.upload-zone.has-file {

}

/* Form */
.form-group {
  margin-bottom: var(--s6);
}
.form-group label {
  display: block;
  font-size: var(--text-sm);
  font-weight: var(--weight-medium);
  color: var(--gray-600);
  margin-bottom: var(--s2);
}
.form-group select,
.form-group input[type="text"] {
  width: 100%;
  padding: 9px 14px;
  font-size: var(--text-sm);
  font-family: var(--font);
  border: 1px solid var(--gray-200);
  border-radius: var(--r-md);
  background: var(--white);
  color: var(--gray-800);
  outline: none;
  transition: all 0.2s;
  appearance: none;
}
.form-group select:focus,
.form-group input:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(0,113,227,0.12);
}

/* Schema details */
.schema-detail {
  background: var(--white);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
  padding: var(--s6);
}
.schema-detail .schema-meta {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--s4);
  padding-bottom: var(--s6);
  border-bottom: 1px solid var(--gray-100);
  margin-bottom: var(--s6);
}
.schema-detail .meta-item .meta-label {
  font-size: var(--text-xs);
  color: var(--gray-400);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: var(--s1);
}
.schema-detail .meta-item .meta-value {
  font-size: var(--text-sm);
  font-weight: var(--weight-medium);
  color: var(--gray-700);
}

/* Responsive */
@media (max-width: 1024px) {
  .kpi-row { grid-template-columns: repeat(2, 1fr); }
  .two-col { grid-template-columns: 1fr; }
  .provider-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ============================
// Mini SPA Framework
// ============================
const API = '/api';

function getToken() { return localStorage.getItem('token'); }
function setToken(t) { localStorage.setItem('token', t); }
function clearToken() { localStorage.removeItem('token'); }

async function api(path, opts = {}) {
  const token = getToken();
  const headers = { ...(opts.headers || {}) };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  if (!(opts.body instanceof FormData) && !headers['Content-Type']) {
    headers['Content-Type'] = 'application/json';
  }
  const res = await fetch(API + path, { ...opts, headers });
  if (res.status === 401) { clearToken(); render(); throw new Error('Unauthorized'); }
  if (!res.ok) throw new Error('API Error ' + res.status);
  const ct = res.headers.get('content-type');
  if (ct && ct.includes('json')) return res.json();
  return res;
}

// Toast
let toastTimer;
function toast(msg) {
  let el = document.querySelector('.toast');
  if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

// Router
let currentRoute = '/';
let routeParams = {};

function navigate(path) {
  history.pushState(null, '', '#' + path);
  currentRoute = path;
  routeParams = {};
  render();
}

window.addEventListener('popstate', () => {
  currentRoute = location.hash.slice(1) || '/';
  render();
});

function parseRoute() {
  const hash = location.hash.slice(1) || '/';
  const parts = hash.split('/').filter(Boolean);
  if (parts[0] === 'jobs' && parts[1]) {
    currentRoute = '/jobs/:id';
    routeParams = { id: parts[1] };
  } else {
    currentRoute = '/' + (parts[0] || '');
    routeParams = {};
  }
}

// ============================
// Icon SVGs
// ============================
const icons = {
  dashboard: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
  list: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>',
  plus: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
  schema: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3h7a2 2 0 012 2v14a2 2 0 01-2 2h-7m0-18H5a2 2 0 00-2 2v14a2 2 0 002 2h7m0-18v18"/></svg>',
  provider: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>',
  chart: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>',
  audit: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>',
  arrow: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>',
  back: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>',
  upload: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>',
  logout: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>',
  refresh: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>',
};

// ============================
// State
// ============================
let state = {
  loading: false,
  jobs: [],
  schemas: [],
  providers: [],
  auditEntries: [],
  evaluationDatasets: [],
  evaluationRuns: [],
  currentJob: null,
  currentResult: null,
  selectedSchemaKey: null,
  evalTab: 'datasets',
};

// ============================
// Status Helpers
// ============================
function statusTag(status) {
  const map = {
    completed: { label: '已完成', cls: 'tag-green' },
    needs_review: { label: '待复核', cls: 'tag-orange' },
    failed: { label: '失败', cls: 'tag-red' },
    running: { label: '运行中', cls: 'tag-blue' },
    queued: { label: '排队中', cls: 'tag-gray' },
    active: { label: '在线', cls: 'tag-green' },
    disabled: { label: '离线', cls: 'tag-gray' },
    inactive: { label: '未激活', cls: 'tag-gray' },
    draft: { label: '草稿', cls: 'tag-gray' },
    ready: { label: '就绪', cls: 'tag-green' },
    open: { label: '待处理', cls: 'tag-orange' },
    success: { label: '成功', cls: 'tag-green' },
    failure: { label: '失败', cls: 'tag-red' },
  };
  const s = map[status] || { label: status || '-', cls: 'tag-gray' };
  return '<span class="tag ' + s.cls + '"><span class="tag-dot"></span>' + s.label + '</span>';
}

function confClass(val) {
  if (val === null || val === undefined) return 'conf-mid';
  const n = typeof val === 'string' ? parseFloat(val) : val;
  if (n >= 0.85) return 'conf-high';
  if (n >= 0.6) return 'conf-mid';
  return 'conf-low';
}

function confLabel(val) {
  if (val === null || val === undefined) return '-';
  const n = typeof val === 'string' ? parseFloat(val) : val;
  return Math.round(n * 100) + '%';
}

function shortId(id) {
  if (!id) return '-';
  return id.length > 16 ? id.slice(0, 16) + '…' : id;
}

function timeAgo(dateStr) {
  if (!dateStr) return '-';
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return '-';
  const now = Date.now();
  const diff = now - d.getTime();
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
  if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
  return d.toLocaleDateString('zh-CN');
}

// ============================
// Sidebar
// ============================
function renderSidebar() {
  const nav = [
    { path: '/', icon: 'dashboard', label: '工作台' },
    { path: '/jobs', icon: 'list', label: '任务列表' },
    { path: '/new', icon: 'plus', label: '新建识别' },
    { path: '/schemas', icon: 'schema', label: 'Schema 管理' },
    { path: '/providers', icon: 'provider', label: 'Provider' },
    { path: '/evaluation', icon: 'chart', label: '评测中心' },
    { path: '/audit', icon: 'audit', label: '审计日志' },
  ];
  const active = currentRoute.startsWith('/jobs/') ? '/jobs' : currentRoute;
  return `
    <nav class="sidebar">
      <div class="sidebar-brand">
        <div class="logo">✦</div>
        <div class="brand-text">
          <h2>医疗文档识别</h2>
          <span>Clinical AI Studio</span>
        </div>
      </div>
      <div class="sidebar-nav">
        <div class="nav-section-label">导航</div>
        ${nav.map(n => `
          <a class="nav-item ${active === n.path ? 'active' : ''}" onclick="navigate('${n.path}')">
            <span class="nav-icon">${icons[n.icon]}</span>
            ${n.label}
          </a>
        `).join('')}
      </div>
      <div class="sidebar-user">
        <div class="avatar">A</div>
        <div class="user-info">
          <div class="user-name">Admin</div>
          <div class="user-email">admin@example.local</div>
        </div>
        <button class="logout-btn" onclick="clearToken();render()" title="退出">${icons.logout}</button>
      </div>
    </nav>
  `;
}

function renderHeader(path) {
  const names = { '/': '工作台', '/jobs': '任务列表', '/new': '新建识别', '/schemas': 'Schema 管理', '/providers': 'Provider 管理', '/evaluation': '评测中心', '/audit': '审计日志' };
  const name = currentRoute.startsWith('/jobs/') ? '任务详情' : (names[currentRoute] || '');
  return `
    <div class="main-header">
      <div class="breadcrumb">
        <span style="color:var(--gray-400)">首页</span>
        <span style="color:var(--gray-300)">/</span>
        <span>${name}</span>
      </div>
    </div>
  `;
}

// ============================
// Pages
// ============================

// -- Dashboard --
async function loadDashboard() {
  try {
    const [jobsRes, provRes, schRes] = await Promise.all([
      api('/jobs?limit=20'),
      api('/providers'),
      api('/schemas'),
    ]);
    state.jobs = jobsRes.items || [];
    state.providers = provRes.items || [];
    state.schemas = schRes.items || [];
  } catch (e) { console.error(e); }
}

function renderDashboard() {
  const jobs = state.jobs;
  const total = jobs.length;
  const review = jobs.filter(j => j.status === 'needs_review').length;
  const done = jobs.filter(j => j.status === 'completed').length;
  const provOnline = state.providers.filter(p => p.status === 'active').length;

  return `
    <div class="content">
      <div class="page-top">
        <div>
          <h1>工作台</h1>
          <div class="page-desc">系统运行概览</div>
        </div>
        <button class="btn btn-primary" onclick="navigate('/new')">+ 新建识别</button>
      </div>
      <div class="kpi-row">
        <div class="kpi">
          <div class="kpi-label"><span class="dot" style="background:var(--blue)"></span>总任务</div>
          <div class="kpi-value">${total}</div>
          <div class="kpi-sub">${review} 个待复核</div>
        </div>
        <div class="kpi">
          <div class="kpi-label"><span class="dot" style="background:var(--orange)"></span>待复核</div>
          <div class="kpi-value">${review}</div>
          <div class="kpi-sub">需要人工确认</div>
        </div>
        <div class="kpi">
          <div class="kpi-label"><span class="dot" style="background:var(--green)"></span>已完成</div>
          <div class="kpi-value">${done}</div>
          <div class="kpi-sub">识别成功</div>
        </div>
        <div class="kpi">
          <div class="kpi-label"><span class="dot" style="background:var(--gray-400)"></span>Provider</div>
          <div class="kpi-value">${state.providers.length}</div>
          <div class="kpi-sub">${provOnline} 个在线</div>
        </div>
      </div>
      <div class="card">
        <div class="card-head">
          <h3>最近任务</h3>
          <button class="btn btn-ghost" onclick="navigate('/jobs')">查看全部 ${icons.arrow}</button>
        </div>
        ${renderJobTable(jobs.slice(0, 10))}
      </div>
    </div>
  `;
}

function renderJobTable(jobs) {
  if (!jobs.length) {
    return '<div class="empty"><div class="empty-icon">📋</div><h3>暂无任务</h3><p>点击"新建识别"开始第一个任务</p></div>';
  }
  return `
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>任务 ID</th><th>Schema</th><th>状态</th><th>创建时间</th><th>操作</th>
        </tr></thead>
        <tbody>
          ${jobs.map(j => `
            <tr onclick="navigate('/jobs/${j.id}')">
              <td><span class="mono">${shortId(j.id)}</span></td>
              <td>${j.schemaKey || '-'}</td>
              <td>${statusTag(j.status)}</td>
              <td>${timeAgo(j.createdAt)}</td>
              <td><button class="btn btn-ghost" onclick="event.stopPropagation();navigate('/jobs/${j.id}')">查看</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

// -- Job List --
async function loadJobs() {
  try {
    const res = await api('/jobs?limit=50');
    state.jobs = res.items || [];
  } catch (e) { console.error(e); }
}

function renderJobList() {
  return `
    <div class="content">
      <div class="page-top">
        <div><h1>任务列表</h1><div class="page-desc">全部识别任务</div></div>
        <button class="btn btn-primary" onclick="navigate('/new')">+ 新建识别</button>
      </div>
      <div class="card">
        <div class="card-head">
          <h3>共 ${state.jobs.length} 个任务</h3>
        </div>
        ${renderJobTable(state.jobs)}
      </div>
    </div>
  `;
}

// -- Job Detail --
async function loadJobDetail(id) {
  try {
    const [job, result] = await Promise.all([
      api('/jobs/' + id),
      api('/results/' + id).catch(() => null),
    ]);
    state.currentJob = job;
    state.currentResult = result;
  } catch (e) { console.error(e); state.currentJob = null; state.currentResult = null; }
}

function renderJobDetail() {
  const job = state.currentJob;
  const result = state.currentResult;
  if (!job) return '<div class="content page-loading"><div class="spinner"></div>加载中…</div>';

  const trace = job.trace || [];
  const traceSteps = trace.length ? trace : [
    { node: 'preprocess', status: 'completed', message: '预处理完成' },
    { node: 'ocr', status: job.status === 'failed' ? 'failed' : 'completed', message: 'OCR 完成' },
    { node: 'extraction', status: job.status === 'failed' ? 'failed' : 'completed', message: '抽取完成' },
  ];

  // Fields from result
  const fields = result?.fields || {};
  const evidence = result?.evidence || [];
  const fieldEntries = Object.entries(fields);

  return `
    <div class="content">
      <div class="detail-header">
        <button class="back-btn" onclick="navigate('/jobs')">${icons.back}</button>
        <div class="detail-title">
          <h1 style="display:flex;align-items:center;gap:12px">
            <span class="mono" style="font-size:var(--text-base)">${shortId(job.id)}</span>
            ${statusTag(job.status)}
          </h1>
        </div>
      </div>
      <div class="two-col">
        <div>
          <div class="card" style="margin-bottom:var(--s6)">
            <div class="card-head"><h3>识别进度</h3></div>
            <div style="padding:var(--s5)">
              <div class="steps">
                ${traceSteps.map((s, i) => `
                  <div class="step">
                    <div class="step-dot-col">
                      <div class="step-dot ${s.status === 'completed' ? 'done' : s.status === 'failed' ? 'error' : s.status === 'running' ? 'active' : ''}"></div>
                      ${i < traceSteps.length - 1 ? '<div class="step-line"></div>' : ''}
                    </div>
                    <div class="step-content">
                      <div class="step-name">${s.node || s.step || '-'}</div>
                      <div class="step-msg">${s.message || s.status || ''}</div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
          <div class="card">
            <div class="card-head"><h3>任务信息</h3></div>
            <div style="padding:var(--s5)">
              <div class="field-row"><div class="field-key">Schema</div><div class="field-value">${job.schemaKey || '-'}</div></div>
              <div class="field-row"><div class="field-key">Provider</div><div class="field-value">${job.providerConfig?.ocrProviderKey || '-'}</div></div>
              <div class="field-row"><div class="field-key">创建时间</div><div class="field-value">${timeAgo(job.createdAt)}</div></div>
              ${job.error ? `<div class="field-row"><div class="field-key">错误</div><div class="field-value" style="color:var(--red)">${typeof job.error === 'object' ? job.error.message || JSON.stringify(job.error) : job.error}</div></div>` : ''}
            </div>
          </div>
        </div>
        <div>
          ${fieldEntries.length ? `
            <div class="card" style="margin-bottom:var(--s6)">
              <div class="card-head"><h3>识别结果</h3></div>
              <div style="padding:0 var(--s6)">
                ${fieldEntries.map(([key, val]) => {
                  const ev = evidence.find(e => e.fieldKey === key);
                  const conf = ev?.confidence;
                  return `
                    <div class="field-row">
                      <div class="field-key">${key}</div>
                      <div class="field-value">${typeof val === 'object' ? JSON.stringify(val) : String(val)}</div>
                      <span class="field-confidence ${confClass(conf)}">${confLabel(conf)}</span>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          ` : `
            <div class="card" style="margin-bottom:var(--s6)">
              <div class="card-head"><h3>识别结果</h3></div>
              <div class="empty" style="padding:var(--s10)"><h3>暂无结果</h3><p>任务完成后识别结果将显示在这里</p></div>
            </div>
          `}
          ${result ? `
            <div class="card">
              <div class="card-head"><h3>置信度</h3></div>
              <div style="padding:var(--s5)">
                <div class="kpi-value" style="font-size:var(--text-2xl)">${confLabel(result.confidence)}</div>
                <div class="kpi-sub">${result.reviewRequired ? '需要人工复核' : '可自动通过'}</div>
              </div>
            </div>
          ` : ''}
        </div>
      </div>
    </div>
  `;
}

// -- New Recognition --
async function loadSchemas() {
  try {
    const res = await api('/schemas');
    state.schemas = res.items || [];
  } catch (e) { console.error(e); }
}

let uploadFile = null;
let selectedSchema = '';

function renderNewRecognition() {
  return `
    <div class="content" style="max-width:640px;margin:0 auto">
      <div class="page-top">
        <div><h1>新建识别</h1><div class="page-desc">上传文档，选择 Schema，开始识别</div></div>
      </div>
      <div class="card" style="padding:var(--s8)">
        <div class="upload-zone ${uploadFile ? 'has-file' : ''}" onclick="document.getElementById('fileInput').click()" id="dropZone">
          <div class="upload-icon">${icons.upload}</div>
          ${uploadFile ? `
            <h3>${uploadFile.name}</h3>
            <p>${(uploadFile.size / 1024).toFixed(1)} KB · 点击更换</p>
          ` : `
            <h3>拖拽文件到此处，或点击上传</h3>
            <p>支持 PDF、PNG、JPG 格式</p>
          `}
        </div>
        <input type="file" id="fileInput" accept="image/*,.pdf" style="display:none" onchange="handleFileSelect(this)" />

        <div class="form-group" style="margin-top:var(--s6)">
          <label>选择 Schema</label>
          <select onchange="selectedSchema=this.value" id="schemaSelect">
            <option value="">请选择…</option>
            ${state.schemas.map(s => `<option value="${s.schemaKey}" ${selectedSchema === s.schemaKey ? 'selected' : ''}>${s.displayName || s.schemaKey} (v${s.version})</option>`).join('')}
          </select>
        </div>

        <button class="btn btn-primary" style="width:100%;justify-content:center;padding:11px" onclick="submitRecognition()" id="submitBtn">
          开始识别
        </button>
      </div>
    </div>
  `;
}

function handleFileSelect(input) {
  uploadFile = input.files[0] || null;
  render();
}

async function submitRecognition() {
  if (!uploadFile) { toast('请上传文件'); return; }
  if (!selectedSchema) { toast('请选择 Schema'); return; }

  const btn = document.getElementById('submitBtn');
  if (btn) { btn.disabled = true; btn.textContent = '上传中…'; }

  try {
    const fd = new FormData();
    fd.append('file', uploadFile);
    const fileRes = await api('/files', { method: 'POST', body: fd });
    const jobRes = await api('/jobs', {
      method: 'POST',
      body: JSON.stringify({ schemaKey: selectedSchema, sourceFileId: fileRes.id }),
    });
    toast('任务已创建');
    uploadFile = null;
    selectedSchema = '';
    navigate('/jobs/' + jobRes.id);
  } catch (e) {
    toast('创建失败: ' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = '开始识别'; }
  }
}

// -- Drag & Drop --
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  const zone = document.getElementById('dropZone');
  if (zone && e.dataTransfer.files.length) {
    uploadFile = e.dataTransfer.files[0];
    render();
  }
});

// -- Schema Management --
async function loadSchemaPage() {
  try {
    const res = await api('/schemas');
    state.schemas = res.items || [];
    if (state.schemas.length && !state.selectedSchemaKey) {
      state.selectedSchemaKey = state.schemas[0].schemaKey;
    }
  } catch (e) { console.error(e); }
}

function renderSchemaPage() {
  const schemas = state.schemas;
  const selected = schemas.find(s => s.schemaKey === state.selectedSchemaKey) || schemas[0];
  const fields = selected?.definition?.fields || [];

  return `
    <div class="content">
      <div class="page-top">
        <div><h1>Schema 管理</h1><div class="page-desc">管理识别模板和字段定义</div></div>
      </div>
      <div class="two-col">
        <div class="list-card">
          ${schemas.length ? schemas.map(s => `
            <div class="list-item ${s.schemaKey === (selected?.schemaKey) ? 'active' : ''}" onclick="state.selectedSchemaKey='${s.schemaKey}';render()">
              <div class="item-title">${s.displayName || s.schemaKey}</div>
              <div class="item-sub">v${s.version} · ${statusTag(s.status)}</div>
            </div>
          `).join('') : '<div class="empty" style="padding:var(--s10)"><h3>暂无 Schema</h3></div>'}
        </div>
        <div class="schema-detail">
          ${selected ? `
            <h2 style="font-size:var(--text-lg);font-weight:var(--weight-semibold);margin-bottom:var(--s5)">${selected.displayName || selected.schemaKey}</h2>
            <div class="schema-meta">
              <div class="meta-item"><div class="meta-label">版本</div><div class="meta-value">v${selected.version}</div></div>
              <div class="meta-item"><div class="meta-label">状态</div><div class="meta-value">${statusTag(selected.status)}</div></div>
              <div class="meta-item"><div class="meta-label">发布时间</div><div class="meta-value">${timeAgo(selected.publishedAt)}</div></div>
            </div>
            <h3 style="font-size:var(--text-sm);font-weight:var(--weight-semibold);color:var(--gray-500);margin-bottom:var(--s3)">字段定义 (${fields.length})</h3>
            ${fields.length ? `
              <div class="table-wrap">
                <table>
                  <thead><tr><th>字段 Key</th><th>标签</th><th>类型</th><th>必填</th></tr></thead>
                  <tbody>
                    ${fields.map(f => `
                      <tr style="cursor:default">
                        <td><span class="mono">${f.key}</span></td>
                        <td>${f.label || '-'}</td>
                        <td><span class="tag tag-gray">${f.type || '-'}</span></td>
                        <td>${f.required ? '<span class="tag tag-blue">必填</span>' : '-'}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            ` : '<div class="empty" style="padding:var(--s8)"><p>此 Schema 无字段定义</p></div>'}
          ` : '<div class="empty"><h3>选择一个 Schema</h3></div>'}
        </div>
      </div>
    </div>
  `;
}

async function checkProviderHealth(key) {

async function setDefaultProvider(key) {

// -- Evaluation --

function renderEvaluation() {

    <div class="content">

        <div><h1>评测中心</h1><div class="page-desc">管理评测数据集和运行记录</div></div>

// Login Page
// ============================
function renderLogin() {
  return `
    <div class="login-page">
      <div class="login-card">
        <div class="login-logo">✦</div>
        <h1>医疗文档识别系统</h1>
        <div class="subtitle">Clinical AI Studio</div>
        <div class="login-field">
          <label>邮箱</label>
          <input type="email" id="loginEmail" value="admin.dev@example.local" />
        </div>
        <div class="login-field">
          <label>密码</label>
          <input type="password" id="loginPass" value="ChangeMe123!" />
        </div>
        <button class="login-btn" onclick="doLogin()" id="loginBtn">登录</button>
      </div>
    </div>
  `;
}

async function doLogin() {
  const email = document.getElementById('loginEmail').value;
  const pass = document.getElementById('loginPass').value;
  const btn = document.getElementById('loginBtn');
  if (btn) { btn.disabled = true; btn.textContent = '登录中…'; }
  try {
    const res = await fetch(API + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pass }),
    });
    if (!res.ok) throw new Error('登录失败');
    const data = await res.json();
    setToken(data.accessToken);
    toast('登录成功');
    render();
  } catch (e) {
    toast('登录失败: ' + e.message);
    if (btn) { btn.disabled = false; btn.textContent = '登录'; }
  }
}

// Enter key for login
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('loginBtn')) {
    doLogin();
  }
});

// ============================
// Render Engine
// ============================
async function render() {
  parseRoute();
  const app = document.getElementById('app');
  if (!getToken()) {
    app.innerHTML = renderLogin();
    return;
  }

  // Show loading skeleton
  const needsData = {
    '/': loadDashboard,
    '/jobs': loadJobs,
    '/new': loadSchemas,
    '/schemas': loadSchemaPage,
    '/providers': loadProviders,
    '/evaluation': loadEvaluation,
    '/audit': loadAudit,
  };

  const loadFn = currentRoute.startsWith('/jobs/') ?
    () => loadJobDetail(routeParams.id) : needsData[currentRoute];

  // Render shell with loading
  const pages = {
    '/': renderDashboard,
    '/jobs': renderJobList,
    '/new': renderNewRecognition,
    '/schemas': renderSchemaPage,
    '/providers': renderProviders,
    '/evaluation': renderEvaluation,
    '/audit': renderAudit,
  };

  const renderFn = currentRoute.startsWith('/jobs/') ?
    renderJobDetail : pages[currentRoute];

  if (!renderFn) {
    app.innerHTML = renderSidebar() + '<div class="main">' + renderHeader() + '<div class="content"><div class="empty"><h3>页面不存在</h3></div></div></div>';
    return;
  }

  // Render with loading state
  app.innerHTML = renderSidebar() + '<div class="main">' + renderHeader() +
    '<div class="page-loading"><div class="spinner"></div>加载中…</div></div>';

  // Load data
  if (loadFn) await loadFn();

  // Re-render with data
  app.innerHTML = renderSidebar() + '<div class="main">' + renderHeader() + renderFn() + '</div>';
}

// ============================
// Boot
// ============================
currentRoute = location.hash.slice(1) || '/';
render();
</script>
